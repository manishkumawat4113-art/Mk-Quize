<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MK Quiz</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>
<body>

    <main class="app">

        <!-- ==========================
             START SCREEN
        =========================== -->

        <section
            id="startScreen"
            class="screen"
        >

            <h1>🧠 JavaScript Quiz</h1>

            <p>
                Test your JavaScript knowledge
            </p>

            <button
                id="startBtn"
                type="button"
            >
                Start Quiz 1
            </button>
            <button id="delBtn1" onclick="watchBtn()"type=button>
                ⬅️Watch All Question
            </button>            
            <button id="fillBtn" type=button>
                If you set your questions,click hear
            </button>

        </section>
  <!-- ==========================
             add question SCREEN
        =========================== -->
       <form id="form" class="question-form hidden">
    <h2>Add Question</h2>
      <span> Total:
                <strong id="totalCount">0</strong>
            </span>
           <br>
      <span> question:
                <strong id="questionCount">0</strong>
            </span>
    <input
        id="questionInput"
        type="text"
        placeholder="Enter your question"
        autocomplete="off"
    >
    <input
        id="option1"
        type="text"
        placeholder="Option 1"
        autocomplete="off"
    >
    <input
        id="option2"
        type="text"
        placeholder="Option 2"
        autocomplete="off"
    >
    <input
        id="option3"
        type="text"
        placeholder="Option 3"
        autocomplete="off"
    >
    <input
        id="option4"
        type="text"
        placeholder="Option 4"
        autocomplete="off"
    >
    <select id="correctAnswer">
        <option value="">Select Correct Answer</option>
        <option value="1">Option 1</option>
        <option value="2">Option 2</option>
        <option value="3">Option 3</option>
        <option value="4">Option 4</option>
    </select>
    <button id="addQuestionBtn" type="button">
        Add Question
    </button>
           <button id="startBtn1" type=button>
                Start Quiz 2
            </button>
           <button id="delBtn" onclick="delbtn()"type=button>
                delet All Question
            </button> 
<button id="delBtn2" class="delBtn"type=button>
           ⬆️ Watch All Question
            </button>            
</form>

        <!-- ==========================
             QUIZ SCREEN
        =========================== -->
        <section
            id="quizScreen"
            class="screen hidden"
        >
<button id="leavebtn">Leave</button>

            <!-- TOP BAR -->

            <div class="quiz-top">
                 <span>
                    Question
                    <strong id="questionNumber">
                        1
                    </strong>
                    /
                    <strong id="totalQuestions">
                        10
                    </strong>
                </span>


                <span id="timer">
                    ⏱️ 15
                </span>

            </div>


            <!-- PROGRESS -->

            <div class="progress-container">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>


            <!-- QUESTION -->

            <h2 id="question">
                Question will appear here
            </h2>


            <!-- OPTIONS -->

            <div id="optionsContainer">

            </div>


            <!-- NEXT -->

            <button
                id="nextBtn"
                type="button"
                disabled
            >
                Next
            </button>

        </section>


        <!-- ==========================
             RESULT SCREEN
        =========================== -->

        <section
            id="resultScreen"
            class="screen hidden"
        >

            <h1>🎉 Quiz Complete!</h1>


            <div class="result-box">

                <p>
                    Your Score
                </p>

                <h2 id="score">
                    0 / 10
                </h2>


                <p>
                    Percentage:
                    <strong id="percentage">
                        0%
                    </strong>
                </p>


                <p>
                    High Score:
                    <strong id="highScore">
                        0
                    </strong>
                </p>

            </div>


            <button
                id="restartBtn"
                type="button"
            >
                🔄 Restart Quiz
            </button>

        </section>

    </main>


    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
